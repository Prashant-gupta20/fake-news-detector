services:
  - type: web
    name: truthlens-fake-news-detector
    runtime: python
    buildCommand: "pip install -r requirements.txt && python backend/model_trainer.py"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: GEMINI_API_KEY
        sync: false
